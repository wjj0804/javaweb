server:
  port: 8080

spring:
  application:
    name: yq-ai-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${YQ_MYSQL_HOST:localhost}:${YQ_MYSQL_PORT:3306}/${YQ_MYSQL_DATABASE:yq_ai_admin}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${YQ_MYSQL_USERNAME:root}
    password: ${YQ_MYSQL_PASSWORD:123456}
    hikari:
      pool-name: YqAiAdminHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
